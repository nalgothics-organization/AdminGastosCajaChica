# Flujo de calidad: corre en cada pull request hacia main y en cada push a main.
# Si un paso falla, el pull request se marca en rojo (verificación de estado).
# Detalle de cada paso y umbrales acordados: docs/PRUEBAS.md
# Fuentes:
#   https://docs.github.com/es/actions/tutorials/build-and-test-code/python
#   https://docs.astral.sh/ruff/integrations/#github-actions

name: Calidad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Linter y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Análisis estático: falla con cualquier hallazgo, incluida una función
      # con complejidad mayor a 10 (regla C901, configurada en pyproject.toml).
      - name: Linter (Ruff)
        run: ruff check --output-format=github .

      # Pruebas y cobertura: falla si alguna prueba falla o si la cobertura de src/
      # baja del umbral (fail_under = 90 en pyproject.toml).
      - name: Pruebas y cobertura (pytest-cov)
        run: python -m pytest tests -v --cov --cov-report=term-missing

      # Dependencias con vulnerabilidades conocidas: pip-audit termina con código 1
      # si encuentra alguna y el flujo se marca en rojo.
      - name: Revisión de dependencias (pip-audit)
        run: pip-audit -r requirements.txt

  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 descarga todo el historial para que Gitleaks revise cada commit, no solo el último
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Imagen oficial de Gitleaks; termina con código 1 si encuentra una llave o contraseña.
      # https://github.com/gitleaks/gitleaks
      - name: Gitleaks (código e historial)
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 git /repo -v --redact
