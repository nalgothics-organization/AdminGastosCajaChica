# Base de datos PostgreSQL del prototipo (contenedor "Base de datos" de docs/CONTAINERS.md).
# Uso: copiar .env.example a .env y ejecutar `docker compose up -d`.
services:
  db:
    image: postgres:16-alpine
    container_name: cajachica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cajachica_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  cajachica_pgdata:
