<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caja chica · Bandeja de autorización</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="ancho">
    <h1>Bandeja de autorización</h1>

    <p id="aviso" class="aviso" role="status" aria-live="polite" hidden></p>

    <section class="panel">
      <label for="usuario">Tu usuario</label>
      <input id="usuario" type="text" placeholder="ADMIN-LAURA" autocomplete="username">
      <p class="nota">Tu nombre y tu rol se toman de tu usuario. Administración decide hasta $5,000; Dirección, cualquier monto.</p>
    </section>

    <h2>Pendientes</h2>
    <p id="contador-bloqueadas" class="alerta rojo" hidden></p>
    <p id="vacio" class="nota" hidden>No hay solicitudes pendientes.</p>
    <div id="pendientes" class="rejilla"></div>

    <h2>Decididas recientemente</h2>
    <ul id="decididas"></ul>
  </main>
  <script src="shell.js"></script>
  <script src="comun.js"></script>
  <script src="autorizacion.js"></script>
</body>
</html>
