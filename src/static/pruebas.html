<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caja chica · Guía de pruebas</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="ancho">
    <section class="hero">
      <div>
        <span class="insignia">Pruebas manuales</span>
        <h1>Guía de pruebas del prototipo</h1>
        <p>Recorre cada historia de usuario con el rol indicado y marca lo que ya verificaste. El avance se guarda solo en este navegador.</p>
      </div>
      <div class="avance-pruebas">
        <p class="cifra" id="avance-cifra">0%</p>
        <div class="barra verde"><span id="avance-barra"></span></div>
        <p class="nota" id="avance-detalle"></p>
      </div>
    </section>

    <p id="aviso" class="aviso" role="status" aria-live="polite" hidden></p>

    <section class="panel filtros">
      <div>
        <label for="filtro-rol">Mostrar pruebas para</label>
        <select id="filtro-rol">
          <option value="">Todos los roles</option>
          <option value="Residente de obra">Residente de obra</option>
          <option value="Administración">Administración</option>
          <option value="Dirección">Dirección</option>
          <option value="Contabilidad">Contabilidad</option>
        </select>
      </div>
      <div>
        <label for="solo-pendientes">Pasos</label>
        <select id="solo-pendientes">
          <option value="">Todos</option>
          <option value="1">Solo pendientes</option>
        </select>
      </div>
      <div class="acciones inicio">
        <button type="button" id="reiniciar" class="secundario">Reiniciar avance</button>
      </div>
    </section>

    <nav id="indice" class="indice-pruebas" aria-label="Historias"></nav>
    <div id="secciones"></div>
  </main>
  <script src="sesion.js"></script>
  <script src="shell.js"></script>
  <script src="comun.js"></script>
  <script src="pruebas.js"></script>
</body>
</html>
