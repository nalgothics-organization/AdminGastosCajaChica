<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caja chica · Saldos por obra</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="ancho">
    <section class="hero">
      <div>
        <span class="insignia">Saldos en tiempo real</span>
        <h1>Saldos por obra</h1>
        <p class="nota">Se actualiza solo cada 10 segundos. <span id="actualizado"></span></p>
      </div>
    </section>

    <p id="aviso" class="aviso" role="status" aria-live="polite" hidden></p>
    <p id="vacio" class="nota" hidden>Todavía no hay movimientos en ninguna obra.</p>
    <div id="obras" class="rejilla"></div>
  </main>
  <script src="shell.js"></script>
  <script src="comun.js"></script>
  <script src="saldos.js"></script>
</body>
</html>
